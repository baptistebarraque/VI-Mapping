# Jauges 0-100. Tout est réglable ici ; les poids du score le sont aussi en direct dans la carte.
#
# Règle commune : chaque jauge est la moyenne pondérée de ses critères CONNUS.
# Si la part des sous-poids connus est inférieure à part_min_connue, la jauge vaut
# « données insuffisantes » et n'entre pas dans le score (elle ne compte jamais 0).

poids:
  engagement: 25
  periscolaire: 25
  parents: 15
  producteurs: 20
  familles: 15

donnees_insuffisantes:
  part_min_connue_jauge: 0.5
  part_min_connue_score: 0.5

# Rayon par défaut, par la route. mode « ou » : un producteur est dans le rayon s'il est à 10 km OU à 15 min.
# 10 km : distance annoncée par V.i entre les écoles et les producteurs ; à 30 km, presque toutes les écoles
# franciliennes ont cinq producteurs et la jauge ne départage plus.
rayon:
  km: 10
  minutes: 15
  mode: ou            # ou | km | minutes

engagement:
  sous_poids: {pat: 35, bio: 25, web: 25, cite_educative: 15}
  pat: {avec_axe_education: 100, sans_axe_education: 50, aucun: 0}
  bio:
    pct_plein: 40      # 40 % de bio = 100 ; 20 % (obligation EGalim) = 50
  web:
    fenetre_mois: 24
    themes_plein: 3    # 3 thèmes alimentaires distincts récents sur le site de la mairie = 100
    poids_sans_date: 0.5   # thème attesté seulement par des pages sans date : compte pour moitié
    themes: [bio, anti_gaspi, potager, education_gout, alimentation_durable]
  # Arrondissements de Paris : PAT, cantine et site web sont ceux de la commune mère si absents.

periscolaire:
  sous_poids: {soir: 50, mercredi: 30, gestionnaire: 20}
  distance_max_m: 300
  # Valeurs selon la précision de l'information disponible
  soir: {oui: 100, accueil_sans_horaire: 50, oui_commune: 70}
  # centre_de_loisirs : accueil nommé « centre / accueil de loisirs », ouvert en principe le mercredi
  mercredi: {oui: 100, centre_de_loisirs: 70, oui_commune: 70}
  gestionnaire: {identifie: 100, non_identifie: 0}
  # Les sources d'accueils ne sont pas exhaustives (monenfant.fr verrouillé) :
  # l'absence d'accueil trouvé vaut « inconnu », pas 0.
  source_exhaustive: false

parents:
  sous_poids: {rattachee: 50, federee: 20, active: 30}
  confiance_min: 0.35
  fenetre_activite_mois: 12
  # Beaucoup de conseils locaux FCPE/PEEP ne sont pas déclarés en propre au RNA :
  # l'absence d'asso trouvée vaut « inconnu », pas 0.
  source_exhaustive: false

producteurs:
  sous_poids: {plus_proche: 60, nombre: 40}
  # Adresses qui situent vraiment la production ou la vente. Un producteur connu par son seul siège est affiché
  # sur la carte mais pas compté ici (ajouter « siege » pour le compter).
  adresses: [lieu_activite, lieu_vente]
  minutes_plein: 15    # 100 si le plus proche est à 15 min ou moins, 0 en bord de rayon
  km_plein: 10         # équivalent quand le rayon est exprimé en km seulement (mode km)
  nombre_plein: 5

familles:
  sous_poids: {nb_eleves: 30, familles_iris: 30, mixite: 40}
  nb_eleves_plein: 300
  familles_iris_plein: 800
  mixite:
    # Mixité = IPS proche de la référence (ni très favorisé ni très défavorisé) + QPV à proximité.
    ips_reference: 104
    ips_amplitude: 40   # écart à la référence qui donne 0
    ips_voisin_max_m: 200   # maternelle (IPS non publié) : IPS de l'élémentaire du même secteur à moins de 200 m
    part_ips: 70
    part_qpv: 30
    qpv_distance_max_m: 300

# Score propre de chaque commune : étape 1 de la demande V.i (repérer les communes, puis leurs écoles).
# Même règle : moyenne pondérée des critères connus ; « données insuffisantes » sous part_min_connue_jauge.
communes:
  sous_poids:
    pat: 20            # intégration à un PAT et priorités
    soutiens: 10       # département, intercommunalité, lauréat de l'appel à projets MGP
    cuisine: 15        # cuisine centrale publique ou cuisine sur place en régie
    cantine_bio: 10    # part de bio déclarée (même barème que la jauge Engagement)
    producteurs: 15    # moyenne de la jauge Producteurs des écoles de la commune (suit le rayon de la carte)
    associations: 10   # associations d'alimentation durable (RNA)
    communications: 10 # signaux alimentaires récents du site de la mairie (mêmes thèmes que engagement.web)
    ecoles: 10         # élèves des écoles du périmètre : familles touchées
  pat:
    part_niveau: 60    # niveau de labellisation (1 ou 2)
    part_restauration: 20
    part_education: 20
    niveau_inconnu: 1  # PAT reconnu sans niveau publié : compté comme niveau 1
  soutiens:
    part_departement: 50   # score 0 à 2 du référentiel
    part_interco: 25       # score 0 à 2 du référentiel (intercommunalité ou EPT)
    part_aap_mgp: 25       # lauréat de l'appel à projets « Restauration collective bio et locale »
  # Cuisine centrale principale (celle qui livre le plus de repas), sinon cuisines sur place
  cuisine:
    municipale: 100
    caisse_des_ecoles: 100
    sur_place_regie: 90
    intercommunale: 80
    autre_public: 70
    sur_place_concedee: 30
    privee: 20
  associations:
    nombre_plein: 5          # 5 associations ou plus : moitié de la note
    densite_plein_10k: 3     # 3 pour 10 000 habitants ou plus : autre moitié
  ecoles:
    eleves_plein: 1500
