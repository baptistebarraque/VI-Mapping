# Registre des sources : origine, licence, fréquence, statut juridique vérifié.
#
# statut :
#   ouverte     : open data / API publique, ou site dont robots.txt et CGU permettent la collecte
#   verrouillee : CGU ou anti-robot l'interdisent ; le moteur refuse de lancer la collecte tant que
#                 « autorisation » n'est pas renseignée (date, référence de l'accord écrit).
#                 Les domaines listés dans « hotes » sont refusés à tous les scrapers.
# frequence : annuelle (open data) ou mensuelle (scraping)
# confiance : valeur par défaut, affinée ligne par ligne par les connecteurs

