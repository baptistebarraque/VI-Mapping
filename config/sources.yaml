  # ------------------------------------------------------------------ Calculs
  rattachements:
    libelle: Rattachements automatiques (accueils, associations)
    producteur: Calcul
    url: config/idf.yaml
    licence: Sans objet
    methode: calcul
    frequence: mensuelle
    statut: ouverte
    confiance: 0.7

  osrm:
    libelle: Distances et temps par la route (OSRM sur OpenStreetMap)
    producteur: Calcul
    url: https://download.geofabrik.de/europe/france/ile-de-france-latest.osm.pbf
    licence: ODbL 1.0
    methode: calcul
    frequence: annuelle
