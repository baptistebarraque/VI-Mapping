    confiance: 0.9

  jauges:
    libelle: Jauges et score global
    producteur: Calcul
    url: config/jauges.yaml
    licence: Sans objet
    methode: calcul
    frequence: mensuelle
    statut: ouverte
    confiance: 0.7

  # ------------------------------------------------------------------ Scraping autorisé
  sites_mairies:
    libelle: Sites web des mairies (signaux, délégations, périscolaire)
    producteur: Communes
    url: https://www.service-public.fr
    licence: Faits extraits (URL, date, thème) ; aucun contenu reproduit
    methode: scraping
    frequence: mensuelle
    statut: ouverte
    confiance: 0.6
    verification:
      le: 2026-11-25
      constat: >
        robots.txt vérifié site par site à chaque passage, réserve TDM (en-tête et balise tdm-reservation)
        respectée. Seuls sont conservés l'URL, le titre, la date et le thème.

  fcpe_departements:
    libelle: FCPE 93 et 95, conseils locaux
    producteur: FCPE 93 / FCPE 95
    url: https://fcpe93.fr
    licence: Faits extraits (nom, commune, site) ; aucun contenu reproduit
    methode: scraping
    frequence: mensuelle
    statut: ouverte
    confiance: 0.6
    verification:
      le: 2026-11-25
      robots: "autorisé (seul /wp-admin/ est exclu)"
      cgu_url: https://www.fcpe95.com/mentions-legales/
      constat: >
        FCPE 95 : mentions légales sans clause de réutilisation. FCPE 93 : pas de mentions légales publiées.
        FCPE 92 : aucun annuaire de conseils locaux. FCPE 77, 78, 91 et 94 : pas de site joignable.

  sites_assos:
    libelle: Sites des associations de parents (date de dernière activité)
    producteur: Associations
    url: https://www.data.gouv.fr/datasets/repertoire-national-des-associations/
    licence: Faits extraits (date) ; aucun contenu reproduit
    methode: scraping
    frequence: mensuelle
    statut: ouverte
    confiance: 0.6
    verification:
      le: 2026-11-25
      constat: robots.txt vérifié site par site. Réseaux sociaux exclus (CGU).

  # ------------------------------------------------------------------ Scraping verrouillé
  monenfant:
    libelle: monenfant.fr (accueils périscolaires)
    producteur: Cnaf
    url: https://monenfant.fr
    licence: Usage personnel et non commercial
    methode: scraping
    frequence: mensuelle
    statut: verrouillee
    confiance: 0.9
    hotes: [monenfant.fr, caf.fr]
    verification:
      le: 2026-11-25
      robots: "autorisé (Disallow vide)"
      cgu_url: https://monenfant.fr/mentions-legales
      constat: >
        Les conditions limitent l'usage à des fins personnelles et non commerciales, interdisent toute
        exploitation commerciale et annoncent des poursuites pénales pour toute autre utilisation que la mise
        en relation des familles avec les structures d'accueil.
      anti_robot: Radware Bot Manager (redirection vers validate.perfdrive.com)
      remplacement: [sirene, osm, sites_mairies]
      demarche: Demander à la Cnaf (Direction des politiques familiale et sociale) un accès ou un export.
    autorisation: null

  amap_idf:
    libelle: Carte du Réseau AMAP Île-de-France
    producteur: Réseau AMAP IdF
    url: https://amap-idf.org/les-amap/trouver-une-amap-en-idf
    licence: Reproduction interdite
    methode: scraping
    frequence: mensuelle
    statut: verrouillee
    confiance: 0.95
    hotes: [amap-idf.org]
    verification:
      le: 2026-11-25
      robots: "autorisé (Disallow vide)"
      cgu_url: https://amap-idf.org/infos-legales
      constat: >
        Reproduction totale ou partielle prohibée ; transfert d'informations vers un site tiers interdit.
      remplacement: [rna, osm]
      demarche: Demander un export au Réseau AMAP IdF (partenaire naturel du projet).
    autorisation: null

  fcpe_paris:
    libelle: FCPE Paris, conseils locaux
    producteur: FCPE 75
    url: https://www.fcpe75.org/sites-des-conseils-locaux/
    licence: Reproduction interdite sans accord écrit
    methode: scraping
    frequence: mensuelle
    statut: verrouillee
    confiance: 0.8
    hotes: [fcpe75.org, fcpe.asso.fr]
    verification:
      le: 2026-11-25
      robots: autorisé
      cgu_url: https://www.fcpe75.org/mentions-legales/
      constat: Toute reproduction, même partielle, interdite sans accord exprès par écrit.
      remplacement: [rna]
      demarche: Demander l'accord écrit de la FCPE Paris.
    autorisation: null

  peep_national:
    libelle: PEEP, associations locales
    producteur: PEEP
    url: https://peep.asso.fr
    licence: Usage personnel et privé
    methode: scraping
    frequence: mensuelle
    statut: verrouillee
    confiance: 0.8
    hotes: [peep.asso.fr]
    verification:
      le: 2026-11-25
      robots: "autorisé (Disallow vide)"
      cgu_url: https://peep.asso.fr/mentions-legales/
      constat: >
        Reproduction autorisée pour un usage personnel et privé uniquement ; toute autre utilisation
        expressément interdite. Aucun site départemental francilien joignable.
      remplacement: [rna]
      demarche: Demander l'accord écrit de la PEEP.
    autorisation: null
